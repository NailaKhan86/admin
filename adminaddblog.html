<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css">


    
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>



</head>
<body>



        <div class="container">
            <h1>Add blog</h1>
        <input type="text" id="title" placeholder="Blog Title">
        <input type="text" id="content" placeholder="Blog Content">
        <button onclick="addBlog()">Add Blog</button>
        </div>


        <script src="./api.js"></script>


        <script>

            firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "./login.html";
            } else if (user.email !== ADMIN_EMAIL) {
                window.location.href = "./dash.html";
            }
            
        }); 
        
        
        function addBlog() {
            let title = document.getElementById("title").value;
            let content = document.getElementById("content").value;

            if (title === "" || content === "") {
                alert("Please fill in all fields.");
            } else {
                db.collection("blogs").add({
                    title: title,
                    content: content
                });

                alert("Blog added successfully!");

                
                document.getElementById("title").value = "";
                document.getElementById("content").value = "";
            }
        }







        </script>


<script>

</script>
    
</body>
</html>
